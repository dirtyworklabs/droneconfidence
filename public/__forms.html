<!doctype html>
<!--
  Static skeleton used only by Netlify's build-time form detection.
  Every field submitted by the React forms must appear here, and every form
  name must match the `form-name` value posted by the app.
  Client submissions POST to /__forms.html.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drone Confidence form registration</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="mobile" />
      <input name="enquiry_type" />
      <input name="custom_location" />
      <input name="preferred_session" />
      <textarea name="message"></textarea>
      <input name="source_page" />
    </form>
  </body>
</html>
